<script src="assets/data/scams.js"></script>
<script>
(function(){
  var S=window.SCAMS.slice().sort(function(a,b){return a.n.localeCompare(b.n)}),q=document.getElementById("sq"),c=document.getElementById("sc"),ch=document.getElementById("sch"),L=document.getElementById("slist");
  function uniq(k){return Array.from(new Set(S.map(function(s){return s[k]}))).sort()}
  uniq("c").forEach(function(v){c.add(new Option(v,v))});uniq("ch").forEach(function(v){ch.add(new Option(v,v))});
  function draw(){
    var t=q.value.toLowerCase(),list=S.filter(function(s){return (!c.value||s.c===c.value)&&(!ch.value||s.ch===ch.value)&&(!t||JSON.stringify(s).toLowerCase().indexOf(t)>-1)});
    document.getElementById("scount").textContent=list.length+" scam types";
    L.innerHTML=list.length?list.map(function(s){return '<details id="'+s.id+'"'+(location.hash.slice(1)===s.id?" open":"")+'><summary><span>'+s.n+' <span class="badge '+s.r+'">'+(s.r==="high"?"High risk":"Medium")+'</span> <span class="badge">'+s.ch+'</span></span></summary><div><p>'+s.s+'</p><div class="grid g2"><div><h4>🚩 Red flags</h4><ul>'+s.f.map(function(x){return"<li>"+x+"</li>"}).join("")+'</ul></div><div><h4>✅ What to do</h4><ul>'+s.d.map(function(x){return"<li>"+x+"</li>"}).join("")+'</ul></div></div><p><a href="report.html?type='+encodeURIComponent(s.n)+'">Report this scam</a> · <a href="help.html">I fell for this</a> · <a href="check.html">Check a link</a></p></div></details>'}).join(""):'<div class="empty">No matches. Try another term.</div>';
  }
  [q,c,ch].forEach(function(e){e.addEventListener("input",draw)});draw();
  if(location.hash){var el=document.getElementById(location.hash.slice(1));if(el)setTimeout(function(){el.scrollIntoView({behavior:"smooth"})},100)}
})();
</script>
