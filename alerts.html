<section style="padding-top:8px">
  <div class="container">
    <div class="toolbar">
      <input id="aq" type="search" placeholder="Search alerts…" aria-label="Search alerts">
      <select id="asev" aria-label="Severity"><option value="">All severities</option><option value="high">High risk</option><option value="med">Caution</option></select>
      <select id="acat" aria-label="Category"><option value="">All categories</option></select>

    </div>

  </div>
</section>
<div class="ad-slot" data-ad="inline"></div>
<div data-include="newsletter"></div>
<script src="assets/data/alerts.js"></script>
<script>
(function(){
  var A=window.ALERTS,q=document.getElementById("aq"),s=document.getElementById("asev"),c=document.getElementById("acat"),L=document.getElementById("alist");
  Array.from(new Set(A.map(function(a){return a.cat}))).sort().forEach(function(v){c.add(new Option(v,v))});
  function draw(){var t=q.value.toLowerCase();var l=A.filter(function(a){return(!s.value||a.sev===s.value)&&(!c.value||a.cat===c.value)&&(!t||JSON.stringify(a).toLowerCase().indexOf(t)>-1)});
    L.innerHTML=l.length?l.map(function(a){return '<article class="card"><span class="badge '+a.sev+'">'+(a.sev==="high"?"High risk":"Caution")+'</span> <span class="badge">'+a.cat+'</span> <span class="badge">'+a.r+'</span><h3 class="mt-2">'+a.t+'</h3><p>'+a.b+'</p><small class="muted">'+new Date(a.d+"T12:00:00").toLocaleDateString(undefined,{year:"numeric",month:"short",day:"numeric"})+' · More: <a href="'+a.src[1]+'" target="_blank" rel="noopener nofollow">'+a.src[0]+' ↗</a></small></article>'}).join(""):'<div class="empty">No alerts match.</div>'}
  [q,s,c].forEach(function(e){e.addEventListener("input",draw)});draw();
})();
</script>
